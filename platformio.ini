; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
; Platform pinned: pioarduino 53.03.10 = Arduino core 3.1.0 / ESP-IDF 5.3 (tested on hardware).
; An unpinned platform update once broke the ADC code (boot loop), so change this deliberately.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino

; Build flags
build_flags =
	; TFT_eSPI display setup lives in the project (no editing of the library needed)
	-DUSER_SETUP_LOADED=1
	-include $PROJECT_INCLUDE_DIR/TFT_eSPI_Setup.h
	-DLILYGO_T_DISPLAY_S3=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; No Arduino-core log output: the USB port carries LabVIEW frames (see DebugLog.h)
	-DCORE_DEBUG_LEVEL=0

; Libraries pinned to the exact versions/commits tested on hardware
lib_deps = 
	bodmer/TFT_eSPI@2.5.43
	bblanchon/ArduinoJson@7.4.2
	https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
	https://github.com/me-no-dev/AsyncTCP.git#ef448a8a1dffe4ec1b72326dd5a26211ff227b49

; Monitor settings (optional but useful)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder